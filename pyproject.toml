[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "BLE"]
# S603/S607: the sidecars run fixed tool command lines (beet, ffmpeg, rsgain) from the image's PATH.
# S108: /tmp is private to the container (a tmpfs in the stacks).
ignore = ["S603", "S607", "S108"]

[tool.ruff.lint.per-file-ignores]
# asserts, fake paths and dummy credentials are fine in tests
"**/tests/*" = ["S101", "S106", "S108"]
