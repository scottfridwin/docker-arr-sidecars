name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: scottfridwin

jobs:
  # ----------------------------------------------------------
  # Test: Run Python unit tests for all sidecars
  # ----------------------------------------------------------
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [lidarr-sidecar, radarr-sidecar, sonarr-sidecar]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          pip install --quiet requests mutagen

      - name: Run shared Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m unittest discover -s shared/python/tests -p 'test_*.py' -v

      - name: Run service-specific tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if find "${{ matrix.service }}" -path '*/test*' -name 'test_*.py' 2>/dev/null | grep -q .; then
            echo "Running tests for ${{ matrix.service }}"
            find "${{ matrix.service }}" -path '*/test*' -name 'test_*.py' -exec dirname {} \; | sort -u | while read dir; do
              python3 -m unittest discover -s "$dir" -p 'test_*.py' -v
            done
          else
            echo "No service-specific tests found for ${{ matrix.service }}, skipping."
          fi

      - name: Verify Python files compile
        run: |
          find "${{ matrix.service }}" -name '*.py' -exec python3 -c "
          import ast, sys
          for f in sys.argv[1:]:
              try:
                  ast.parse(open(f).read())
              except SyntaxError as e:
                  print(f'FAIL: {f}: {e}')
                  sys.exit(1)
          print(f'All {len(sys.argv)-1} files compile OK')
          " {} +

  # ----------------------------------------------------------
  # Build: Build and push Docker images
  # ----------------------------------------------------------
  build:
    name: Build ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    # Build + push on branch/tag pushes and manual runs; PRs only run tests.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: [lidarr-sidecar, radarr-sidecar, sonarr-sidecar]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure release tags point at a commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not point at a commit on main; refusing to release."
            exit 1
          fi

      - name: Docker metadata (tags + version)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ----------------------------------------------------------
  # Release: create a GitHub Release when a v* tag is pushed.
  # Image tags + version label come from the build job above.
  # ----------------------------------------------------------
  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Docker images
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/radarr-sidecar:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/sonarr-sidecar:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/lidarr-sidecar:${{ github.ref_name }}
            ```
