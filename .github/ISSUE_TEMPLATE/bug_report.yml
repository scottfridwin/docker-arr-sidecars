name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: sidecar
    attributes:
      label: Sidecar
      options:
        - lidarr-sidecar
        - radarr-sidecar
        - sonarr-sidecar
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Image version
      description: The image tag or digest you are running.
      placeholder: ghcr.io/scottfridwin/lidarr-sidecar:3.1.0
    validations:
      required: true
  - type: input
    id: arr-version
    attributes:
      label: Lidarr, Radarr or Sonarr version
      placeholder: Lidarr 3.1.0.4875
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Container log
      description: >-
        Run with `LOG_LEVEL=DEBUG` if possible. Remove API keys, ARL tokens and host names you do not want to share.
      render: text
